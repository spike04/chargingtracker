name: chargingtracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  equatable: ^3.0.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: GoogleSans17pt
      fonts:
        - asset: assets/fonts/GoogleSans_17pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans_17pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/GoogleSans_17pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans_17pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans_17pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans_17pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/GoogleSans_17pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans_17pt-BoldItalic.ttf
          weight: 700
          style: italic

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_logo.png"

flutter_native_splash:
  # App is dark-only — use the dark scaffold background (#07110E) so the
  # splash blends seamlessly into the first frame of the app.
  color: "#07110E"
  image: "assets/icon/app_logo.png"
  image_dark: "assets/icon/app_logo.png"
  color_dark: "#07110E"
  # Scale the splash image to 1/3 of screen width for a clean centred look
  android_12:
    image: "assets/icon/app_logo.png"
    icon_background_color: "#07110E"
    image_dark: "assets/icon/app_logo.png"
    icon_background_color_dark: "#07110E"
  android: true
  ios: true
  web: false
